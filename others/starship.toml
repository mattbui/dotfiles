"$schema" = "https://starship.rs/config-schema.json"

# cmd-footer already handle dynamically adding newline before the prompt, check init.zsh
add_newline = false
palette = "rose_pine_dawn"

format = """
$directory\
${custom.agent_worktree}\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
($username$hostname )\
$all\
$line_break\
$jobs\
$character"""

[profiles]
# this will be rendered as part of the previous command output to show:
# status, completion time, and optionally duration
cmd-footer = "${env_var.STARSHIP_CMD_OK}${env_var.STARSHIP_CMD_ERR}$cmd_duration"

[env_var.STARSHIP_CMD_OK]
format = "[✓](success) at [$env_value]($style)"
style = "muted dimmed"

[env_var.STARSHIP_CMD_ERR]
format = "[✗](error) at [$env_value]($style)"
style = "muted dimmed"

[cmd_duration]
min_time = 2000
format = " · took [$duration]($style)"
style = "muted dimmed"

[character]
success_symbol = "[→](accent)"
error_symbol = "[→](accent)"
vimcmd_symbol = "[←](warning)"

[username]
format = "[$user]($style)"
style_user = "muted dimmed"
style_root = "error"

[hostname]
format = "[@$hostname]($style)"
style = "muted dimmed"

[directory]
style = "primary"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "accent"
only_attached = true

[git_commit]
format = "on [ $hash$tag]($style) "
style = "accent"
only_detached = true
tag_disabled = false
tag_symbol = "  "

[git_state]
style = "warning"

[git_status]
style = "error"
format = "([$all_status$ahead_behind]($style))"
conflicted = "[=${count}](error) "
ahead = "[⇡${count}](success) "
behind = "[⇣${count}](warning) "
diverged = "[⇡${ahead_count}](success)[⇣${behind_count}](warning) "
untracked = "[?${count}](info) "
stashed = '[*${count}](secondary) '
modified = "[!${count}](warning) "
staged = "[+${count}](success) "
renamed = "[~${count}](warning) "
deleted = "[-${count}](error) "

[aws]
format = "on [($profile )($region )($duration )]($style)"
symbol = ""
style = "warning"

[bun]
symbol = " "
style = "error"

[deno]
symbol = " "
style = "success"

[nodejs]
symbol = " "
style = "success"
not_capable_style = "error"

[package]
symbol = "󰏗 "
style = "warning"

[python]
symbol = " "
style = "primary"
generic_venv_names = [".venv", "venv"]

[jobs]
style = "primary"

[fill]
symbol = " "
style = ""

[custom.agent_worktree]
command = '''
root=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0
git_dir=$(git rev-parse --git-dir 2>/dev/null) || exit 0
common_dir=$(git rev-parse --git-common-dir 2>/dev/null) || exit 0

# Normalize relative and absolute paths before checking for a linked worktree.
git_dir=$(CDPATH= cd "$git_dir" 2>/dev/null && pwd -P) || exit 0
common_dir=$(CDPATH= cd "$common_dir" 2>/dev/null && pwd -P) || exit 0

test "$git_dir" = "$common_dir" && exit 0

case "$common_dir" in
  */.git)
    project_dir=${common_dir%/.git}
    project=${project_dir##*/}
    ;;
  */.bare)
    project_dir=${common_dir%/.bare}
    project=${project_dir##*/}
    ;;
  *)
    project=${common_dir##*/}
    project=${project%.git}
    ;;
esac

case "$root" in
  "$HOME"/.codex/worktrees/*/*) agent=codex ;;
  */.claude/worktrees/*) agent=claude ;;
  *) agent= ;;
esac

if test -n "$agent" && test -n "$project"; then
  printf '%s/%s' "$agent" "$project"
elif test -n "$agent"; then
  printf '%s' "$agent"
elif test -n "$project"; then
  printf '%s' "$project"
fi
'''
when = true
require_repo = true
format = '([$symbol$output]($style) )'
symbol = "󰃻 "
style = "info dimmed"
shell = ["sh"]

[palettes.tokyonight_storm]
accent = "#bb9af7"
primary = "#7aa2f7"
info = "#7dcfff"
success = "#9ece6a"
warning = "#e0af68"
error = "#f7768e"
secondary = "#9d7cd8"
muted = "#a9b1d6"

