#+---------+
#+ Plugins +
#+---------+
set -g @prefix_highlight_show_copy_mode "on"
set -g @prefix_highlight_show_sync_mode "on"

set -g @prefix_highlight_prefix_prompt 'Prefix'
set -g @prefix_highlight_copy_prompt 'Copy'
set -g @prefix_highlight_sync_prompt 'Sync'

#+--------+
#+ Status +
#+--------+
#+--- Layout ---+
set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g status-right-length "100"
set -g status-left-length "100"

#+--- Bars ---+
set -g status-right-style "none"

set -g status-style "none,fg=${THEME_TEXT},bg=${THEME_BACKGROUND}"
set -g @session_name_limit "24"
if-shell "'${HOME}/.config/tmux/scripts/tmux-min-version.sh' 3.2" \
  "set-option -g status-left '#[fg=${THEME_ON_COLOR},bg=${THEME_MUTED}] #{?#{==:#{client_pid},#{@session_switcher_client_pid}},#{q/h:@session_switcher_view},#{q/h;=/-#{@session_name_limit}/…:session_name}}#[fg=${THEME_BACKGROUND},bg=${THEME_MUTED}]▕'" \
  "set-option -g status-left '#[fg=${THEME_ON_COLOR},bg=${THEME_MUTED}] #{=/-#{@session_name_limit}/…:session_name}#[fg=${THEME_BACKGROUND},bg=${THEME_MUTED}]▕'"
set -g status-right "#[fg=${THEME_MUTED},bg=${THEME_BACKGROUND}]#{tmux_mode_indicator}#[fg=${THEME_MUTED},bg=${THEME_PANEL}] MEM #{ram_percentage} #[fg=${THEME_ON_COLOR},bg=${THEME_MUTED}] CPU #{cpu_percentage} "

#+--- Windows ---+
# Shared pane context
set -g @pane_context_path_title "#{b:pane_current_path}"
set -g @pane_context_status_path_title "#{?#{==:#{pane_current_path},#{session_path}},,#{E:@pane_context_path_title}}"

# Window status context
set -g @pane_context_pi_title "#{?#{@pi_session_name},#{=/23/..:@pi_session_name},#{E:@pane_context_status_path_title}}"
set -g @pane_context_label "#{?#{@pi_session_active},pi,#{?#{@ssh_session_active},ssh,#{pane_current_command}}}"
set -g @pane_context_title "#{?#{@pi_session_active},#{E:@pane_context_pi_title},#{?#{@ssh_session_active},#{@ssh_session_name},#{E:@pane_context_status_path_title}}}"
set -g @pane_context_suffix "#{?#{E:@pane_context_title}, | #{E:@pane_context_title},}"

# Choose tree context
set -g @pane_context_choose_pi_title "#{E:@pane_context_path_title}#{?#{@pi_session_name}, | #{@pi_session_name},}"
set -g @pane_context_choose_title "#{?#{@pi_session_active},#{E:@pane_context_choose_pi_title},#{?#{@ssh_session_active},#{@ssh_session_name},#{E:@pane_context_path_title}}}"
set -g @choose_tree_format "#{?window_bell_flag,#[fg=${THEME_WARNING}][!] #[default],}#[fg=#{?window_active,${THEME_ACCENT},${THEME_MUTED}}]#{E:@pane_context_label}#[default] #[fg=${THEME_MUTED}]| #[fg=#{?window_active,${THEME_PRIMARY},${THEME_MUTED}}]#{E:@pane_context_choose_title}#[default]"
set -g @choose_tree_key_format "#{?#{e|<:#{line},40},#{=1:#{=-#{e|-:40,#{line}}:#{l:0123456789abcdeiopsuwyzABCDEFILPQRSUVWYZ}}},}"

# Window status structure
# ├── index style
# ├── index
# ├── context style
# └── body
#     ├── zoom indicator
#     ├── context label
#     └── optional title suffix

# Window status components
set -g @window_status_body "#{?window_zoomed_flag,(+),}#{E:@pane_context_label}#{E:@pane_context_suffix} "
set -g @window_status_index_style "#{?window_bell_flag,#[none]#[fg=${THEME_ON_COLOR}]#[bg=${THEME_WARNING}],#[fg=${THEME_INACTIVE_BG}]#[bg=${THEME_MUTED}]}"
set -g @window_status_current_index_style "#[fg=${THEME_ACTIVE_BG},bg=${THEME_ACCENT}]"
set -g @window_status_context_style "#[fg=${THEME_MUTED},bg=${THEME_INACTIVE_BG}]"
set -g @window_status_current_context_style "#[fg=${THEME_TEXT},bg=${THEME_ACTIVE_BG}]"

# Window status layout
setw -g window-status-activity-style "none,fg=${THEME_MUTED},bg=${THEME_INACTIVE_BG}"
setw -g window-status-bell-style "reverse"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=${THEME_MUTED},bg=${THEME_INACTIVE_BG}"
setw -g window-status-format "#{E:@window_status_index_style} #I #{E:@window_status_context_style} #{E:@window_status_body}"
setw -g window-status-current-format "#{E:@window_status_current_index_style} #I #{E:@window_status_current_context_style} #{E:@window_status_body}"

#+-------+
#+ Panes +
#+-------+
set -g pane-border-style "fg=${THEME_PANEL}"
set -g pane-active-border-style "fg=${THEME_PRIMARY}"
set -gq pane-border-indicators colour

# +----------+
# + Messages +
# +----------+
set -g mode-style "bg=${THEME_PANEL}"
set -gq copy-mode-position-style "fg=${THEME_ON_COLOR},bg=${THEME_WARNING}"
set -gq copy-mode-selection-style "bg=${THEME_SELECTION_BG}"
if-shell "'${HOME}/.config/tmux/scripts/tmux-min-version.sh' 3.3" {
  set-hook -g pane-mode-changed {
    if-shell -F '#{==:#{pane_mode},copy-mode}' {
      set-option -p cursor-style block
    } {
      set-option -p cursor-style default
    }
  }
}
if-shell "'${HOME}/.config/tmux/scripts/tmux-min-version.sh' 3.7" {
  set -g message-style "fg=${THEME_PRIMARY},bg=${THEME_PANEL},fill=${THEME_PANEL}"
  set -g message-command-style "fg=${THEME_PRIMARY},bg=${THEME_PANEL},fill=${THEME_PANEL}"
} {
  set -g message-style "fg=${THEME_PRIMARY},bg=${THEME_PANEL}"
  set -g message-command-style "fg=${THEME_PRIMARY},bg=${THEME_PANEL}"
}

#+---------------------+
#+ Tmux mode indicator +
#+---------------------+
# style values for prefix prompt
set -g @mode_indicator_prefix_mode_style "bg=${THEME_INSERT},fg=${THEME_ON_COLOR}"
# style values for copy prompt
set -g @mode_indicator_copy_mode_style "bg=${THEME_WARNING},fg=${THEME_ON_COLOR}"
# style values for sync prompt
set -g @mode_indicator_sync_mode_style "bg=${THEME_ERROR},fg=${THEME_ON_COLOR}"
# style values for empty prompt
set -g @mode_indicator_empty_mode_style "bg=${THEME_MUTED},fg=${THEME_ON_COLOR}"

set -g @suspend_suspended_options " \
  @mode_indicator_custom_prompt:: ---- , \
  @mode_indicator_custom_mode_style::bg=${THEME_INACTIVE_BG}\\,fg=${THEME_MUTED}, \
"
