# Use Ctrl-Space as tmux leader/prefix, except in SSH sessions.
if-shell 'test -z "${SSH_CONNECTION}${SSH_CLIENT}${SSH_TTY}"' {
  unbind C-b
  set -g prefix C-Space
  bind-key C-Space send-prefix
}

# detach still work if hold Ctrl
bind-key C-d detach-client

# Terminal user-key registry.
# Alacritty and Ghostty emit CSI 9001-9024. UserN always maps to CSI 9000+N.
#
# User1-User9: Command-1 through Command-9
# User10: Command-J
# User11: Command-L
# User12: Command-D
# User13: Control-Tab
# User14: Control-Shift-Tab
# User15: F18
# User16: Command-K
# User17: Control-Enter
# User18: Command-N
# User19: Command-W
# User20: Command-T
# User21: Command-O
# User22: Command-P
# User23: Command-R
# User24: Command-G
set-option -s user-keys[1] "\e[9001u"
set-option -s user-keys[2] "\e[9002u"
set-option -s user-keys[3] "\e[9003u"
set-option -s user-keys[4] "\e[9004u"
set-option -s user-keys[5] "\e[9005u"
set-option -s user-keys[6] "\e[9006u"
set-option -s user-keys[7] "\e[9007u"
set-option -s user-keys[8] "\e[9008u"
set-option -s user-keys[9] "\e[9009u"
set-option -s user-keys[10] "\e[9010u"
set-option -s user-keys[11] "\e[9011u"
set-option -s user-keys[12] "\e[9012u"
set-option -s user-keys[13] "\e[9013u"
set-option -s user-keys[14] "\e[9014u"
set-option -s user-keys[15] "\e[9015u"
set-option -s user-keys[16] "\e[9016u"
set-option -s user-keys[17] "\e[9017u"
set-option -s user-keys[18] "\e[9018u"
set-option -s user-keys[19] "\e[9019u"
set-option -s user-keys[20] "\e[9020u"
set-option -s user-keys[21] "\e[9021u"
set-option -s user-keys[22] "\e[9022u"
set-option -s user-keys[23] "\e[9023u"
set-option -s user-keys[24] "\e[9024u"

# Choose tree
# Alacritty/Ghostty map Command-P to User22 for the window tree.
# Keep both branches in strings so older tmux versions do not parse unsupported
# flags and formats from the modern bindings.
if-shell "'${HOME}/.config/tmux/scripts/tmux-min-version.sh' 3.6" \
  "bind-key p choose-tree -Zw -F '#{E:@choose_tree_format}' -K '#{E:@choose_tree_key_format}' ; \
   bind-key P choose-tree -Zs -F '#{E:@choose_tree_format}' -K '#{E:@choose_tree_key_format}' ; \
   bind-key C-p choose-tree -Zw -F '#{E:@choose_tree_format}' -K '#{E:@choose_tree_key_format}' ; \
   bind-key -n User22 choose-tree -Zw -F '#{E:@choose_tree_format}' -K '#{E:@choose_tree_key_format}'" \
  "bind-key p choose-tree -w -F '#{E:@choose_tree_format}' ; \
   bind-key P choose-tree -s -F '#{E:@choose_tree_format}' ; \
   bind-key C-p choose-tree -w -F '#{E:@choose_tree_format}' ; \
   bind-key -n User22 choose-tree -w -F '#{E:@choose_tree_format}'"

# Alacritty/Ghostty map Command-K to User16 for the project/session picker.
bind-key -n User16 run-shell "\"${HOME}/.config/tmux/scripts/tmux-launcher.sh\""

# prefix + t to create new window
unbind t
unbind C-t
bind-key t new-window
bind-key C-t new-window

# Alacritty/Ghostty map Command-T to a tmux user key for tmux window creation.
bind-key -n User20 new-window

# Alacritty/Ghostty map Command-O to a tmux user key for a Yazi popup.
if-shell 'tmux list-commands display-popup >/dev/null 2>&1' \
  'bind-key -n User21 run-shell -C "display-popup -B -E -d #{q:pane_current_path} -e YAZI_START_DIR=#{q:pane_current_path} -e YAZI_TMUX_POPUP=1 -w 90% -h 60% yazi"' \
  'bind-key -n User21 run-shell -C "new-window -c #{q:pane_current_path} -e YAZI_START_DIR=#{q:pane_current_path} yazi"'

# Alacritty/Ghostty map Command-N to the new-session launcher.
bind-key -n User18 run-shell "\"${HOME}/.config/tmux/scripts/tmux-launcher.sh\" --new-session"

# Alacritty/Ghostty map Command-R to the current-session rename prompt.
bind-key -n User23 command-prompt -I "#{session_name}" -p "Session name:" \
  "rename-session \"%%\""

# Alacritty/Ghostty map Command-G to the current-session directory picker.
# The picker stores its result on the originating pane so attach-session runs
# in this client's command queue and can update the session working directory.
bind-key -n User24 \
  set-option -pqu @session_path_selection \; \
  run-shell "\"${HOME}/.config/tmux/scripts/tmux-launcher.sh\" --select-directory" \; \
  if-shell -F '#{@session_path_selection}' \
    'attach-session -E -c "#{@session_path_selection}" ; display-message "Changed session path: #{session_path}"' \
    '' \; \
  set-option -pqu @session_path_selection

# prefix + w to kill pane
unbind w
unbind C-w
bind-key w kill-pane
bind-key C-w kill-pane

# Alacritty maps Command-W to a tmux user key for tmux pane/window close.
bind-key -n User19 if-shell -F \
  '#{||:#{!=:#{pane_current_command},#{b:default-shell}},#{&&:#{==:#{window_panes},1},#{==:#{session_windows},1}}}' \
  'confirm-before -p "#{?#{!=:#{pane_current_command},#{b:default-shell}},#{pane_current_command} is running.,Last pane in session: #{session_name}.} Confirm to close? (y/n)" kill-pane' \
  'kill-pane'

# prefix + Q to kill session
unbind Q
bind-key Q kill-session

unbind J
bind-key -r J next-window
unbind K
bind-key -r K previous-window

# Alacritty maps Command-number to tmux user keys for direct window selection.
bind-key -n User1 select-window -t:=1
bind-key -n User2 select-window -t:=2
bind-key -n User3 select-window -t:=3
bind-key -n User4 select-window -t:=4
bind-key -n User5 select-window -t:=5
bind-key -n User6 select-window -t:=6
bind-key -n User7 select-window -t:=7
bind-key -n User8 select-window -t:=8
bind-key -n User9 select-window -t:=9

# Alacritty/Ghostty map Ctrl-Tab / Ctrl-Shift-Tab to the server-wide MRU
# preview. Ctrl release commits the owner client's selection. Define the escape
# sequences on every supported tmux version, but keep modern client formats
# inside the quoted 3.2+ branch so tmux 3.0 does not parse them.
if-shell "'${HOME}/.config/tmux/scripts/tmux-min-version.sh' 3.2" \
  "bind-key -n User13 run-shell '\"${HOME}/.config/tmux/scripts/switch-session-mru.sh\" next #{q:client_name} #{client_pid} #{q:session_id}' ; \
   bind-key -n User14 run-shell '\"${HOME}/.config/tmux/scripts/switch-session-mru.sh\" prev #{q:client_name} #{client_pid} #{q:session_id}' ; \
   bind-key -n User15 run-shell '\"${HOME}/.config/tmux/scripts/switch-session-mru.sh\" release #{q:client_name} #{client_pid}'"

# Alacritty/Ghostty map Command-J/L to tmux user keys for directional splits.
bind-key -n User10 split-window -v -l 40% -c "#{pane_current_path}"
bind-key -n User11 split-window -h -l 45% -c "#{pane_current_path}"

# Alacritty maps Command-D to a tmux user key for a revdiff popup that copies annotations.
bind-key -n User12 run-shell "sh \"${HOME}/.config/tmux/scripts/revdiff-popup.sh\" --clipboard -- HEAD"

bind-key -r h resize-pane -L 5
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r l resize-pane -R 5

# prefix + R to reload/source tmux settings
bind-key R source ~/.tmux.conf

# Forward Ctrl-_ / Ctrl-- as raw 0x1f for terminal apps like pi undo.
bind-key -n C-_ send-keys -H 1f

# toggle maximize current window
bind-key enter resize-pane -Z

# Alacritty maps Ctrl-Enter to a tmux user key for pane zoom.
bind-key -n User17 resize-pane -Z

unbind space
bind-key space copy-mode

# Alt-Space enters tmux copy/scroll mode.
bind-key -n M-Space copy-mode

# use esc key in copy-mode-vi
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi i send-keys -X cancel

# vim-like selection copy-mode
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle
if-shell -b 'test $(uname) = "Linux"' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
if-shell -b 'test $(uname) = "Darwin"' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'
